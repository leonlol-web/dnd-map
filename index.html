<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта D&D</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #121212;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
      background-color: #121212;
    }

    /* Панель управления над картой */
    .controls {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(20, 20, 20, 0.85);
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #444;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .btn-city {
      background-color: #8b0000;
      color: #ffffff;
      border: 1px solid #ff4500;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-city:hover {
      background-color: #a00000;
      transform: scale(1.03);
    }

    .btn-city:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- Кнопка перехода к городу -->
  <div class="controls">
    <button class="btn-city" onclick="goToCity()">Перейти к городу</button>
  </div>

  <!-- Контейнер карты -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Размеры изображения карты (в пикселях)
    const imageWidth = 2000;
    const imageHeight = 1500;
    const bounds = [[0, 0], [imageHeight, imageWidth]];

    // Инициализация карты в простых координатах (Simple CRS)
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1,
      maxZoom: 3,
      zoomSnap: 0.5
    });

    // Добавление карты
    const image = L.imageOverlay('./teesrosshrar_shore.png', bounds).addTo(map);

    // Центрирование карты при загрузке
    map.fitBounds(bounds);

    // Функция быстрый переход к городу (координаты можно скорректировать)
    function goToCity() {
      // Переход к условным координатам центра города
      map.flyTo([750, 1000], 1.5, {
        duration: 1.5
      });
    }
  </script>

</body>
</html>
