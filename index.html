<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Interactive World Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #111; color: #fff; }
        #map { width: 100vw; height: 100vh; background: #111; }
        #controls {
            position: absolute; top: 10px; left: 10px; z-index: 1000;
            background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px;
            border: 1px solid #444; backdrop-filter: blur(5px); max-width: 280px;
        }
        button {
            background: #4A90E2; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; margin-top: 8px; width: 100%;
        }
        button:hover { background: #357ABD; }
        .hidden { display: none; }
        .status-text { font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

<div id="controls">
    <h3 id="map-title" style="margin-top:0; margin-bottom:8px;">Карта Мира</h3>
    <div id="status" class="status-text">Загрузка карты мира...</div>
    <button id="back-button" class="hidden" onclick="loadMap('world')">← Вернуться на Карту Мира</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', {
        crs: L.CRS.Simple,
        minZoom: -2,
        maxZoom: 2
    });

    let currentLayer = null;
    let markers = [];

    // База данных карт и меток
    const mapsData = {
        'world': {
            title: 'Карта Мира',
            imageUrl: 'world.jpg', // Файл картинки карты мира в репозитории
            cities: [
                { id: 'capital', name: 'Столица', coords: [500, 800], cityMap: 'city_capital.jpg' }
                // Сюда можно добавлять другие города
            ]
        }
    };

    function clearMarkers() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
    }

    function loadMap(mapKeyOrUrl, title = 'Карта', isCity = false) {
        clearMarkers();
        const statusEl = document.getElementById('status');
        const backBtn = document.getElementById('back-button');
        const titleEl = document.getElementById('map-title');

        statusEl.innerText = 'Загрузка изображения...';
        titleEl.innerText = title;

        let imageUrl = mapKeyOrUrl;
        let mapConfig = null;

        if (mapsData[mapKeyOrUrl]) {
            mapConfig = mapsData[mapKeyOrUrl];
            imageUrl = mapConfig.imageUrl;
            titleEl.innerText = mapConfig.title;
        }

        const img = new Image();
        img.src = imageUrl;

        img.onload = function() {
            const w = this.width;
            const h = this.height;
            const bounds = [[0, 0], [h, w]];

            if (currentLayer) {
                map.removeLayer(currentLayer);
            }

            currentLayer = L.imageOverlay(imageUrl, bounds).addTo(map);
            map.fitBounds(bounds);
            statusEl.innerText = '';

            // Если это карта мира, создаем метки городов
            if (mapConfig && mapConfig.cities) {
                mapConfig.cities.forEach(city => {
                    const marker = L.marker(city.coords).addTo(map);
                    marker.bindPopup(`<b>${city.name}</b><br><button onclick="loadMap('${city.cityMap}', '${city.name}', true)">Перейти в город</button>`);
                    markers.push(marker);
                });
            }

            if (isCity) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }
        };

        img.onerror = function() {
            statusEl.innerText = 'Ошибка: файл ' + imageUrl + ' не найден в репозитории.';
        };
    }

    // Запуск карты мира по умолчанию
    loadMap('world');
</script>
</body>
</html>
