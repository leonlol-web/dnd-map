<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Interactive Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background: #111; color: #fff; }
    #map { width: 100vw; height: 100vh; background: #111; }
    #controls {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px;
      border: 1px solid #444; backdrop-filter: blur(5px); min-width: 200px;
    }
    button {
      background: #440002; color: white; border: none; padding: 5px 12px;
      border-radius: 4px; cursor: pointer; margin-top: 5px; width: 100%;
    }
    button:hover { background: #570d03; }
    .status-text { font-size: 12px; color: #aaa; margin-top: 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div id="controls">
  <h2 id="map-title" style="margin-top:0; margin-bottom: 5px;">Карта Мира</h2>
  <div id="status" class="status-text">Загрузка карты мира...</div>
  <button id="back-button" class="hidden" onclick="loadWorldMap()">← Вернуться на Карту Мира</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 2,
  });

  let currentLayer = null;
  let markers = [];

  // Данные карт и меток
  const mapData = {
    world: {
      title: "Карта Мира",
      // Используем относительный путь ./world.jpg
      imageUrl: "./world.jpg", 
      bounds: [[0, 0], [1000, 1000]],
      markers: [
        {
          coords: [400, 800],
          title: "Столица",
          onClick: () => loadSubMap('city', 'Столица')
        }
      ]
    },
    city: {
      title: "Карта Города",
      imageUrl: "./city_capital.jpg",
      bounds: [[0, 0], [800, 800]],
      markers: []
    }
  };

  function clearMap() {
    if (currentLayer) {
      map.removeLayer(currentLayer);
    }
    markers.forEach(marker => map.removeLayer(marker));
    markers = [];
  }

  function loadMap(mapConfig) {
    clearMap();

    document.getElementById('map-title').innerText = mapConfig.title;

    const img = new Image();
    img.src = mapConfig.imageUrl;

    img.onload = function() {
      const w = this.width;
      const h = this.height;

      const bounds = [[0, 0], [h, w]];

      currentLayer = L.imageOverlay(mapConfig.imageUrl, bounds).addTo(map);
      map.fitBounds(bounds);

      if (mapConfig.markers) {
        mapConfig.markers.forEach(m => {
          const marker = L.marker(m.coords).addTo(map);
          marker.bindPopup(m.title);
          if (m.onClick) {
            marker.on('click', m.onClick);
          }
          markers.push(marker);
        });
      }

      document.getElementById('status').innerText = "";
    };

    img.onerror = function() {
      document.getElementById('status').innerText = "Ошибка: Файл " + mapConfig.imageUrl + " не найден в репозитории.";
    };
  }

  function loadWorldMap() {
    document.getElementById('back-button').classList.add('hidden');
    loadMap(mapData.world);
  }

  function loadSubMap(key, name) {
    if (mapData[key]) {
      document.getElementById('back-button').classList.remove('hidden');
      loadMap(mapData[key]);
    }
  }

  // Запуск при загрузке
  loadWorldMap();
</script>

</body>
</html>
